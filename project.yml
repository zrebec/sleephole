# XcodeGen spec – run `xcodegen generate` after editing. The .xcodeproj is generated (git-ignored).
name: SleepHole
options:
  bundleIdPrefix: sk.zrebec
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: sk
  createIntermediateGroups: true
packages:
  SleepCore:
    path: SleepCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SleepHole:
    type: application
    platform: iOS
    sources:
      - path: SleepHole
      # whole folder is bundled as "sprites/" (catalog.json + L0…L4) – keep only shippable files in it
      - path: assets/sprites
        type: folder
      # audio files go to the bundle root (UNNotificationSound(named:) looks there)
      - path: assets/audio
        buildPhase: resources
        excludes:
          - "*.txt"
    dependencies:
      - package: SleepCore
    info:
      path: SleepHole/Info.plist
      properties:
        CFBundleDisplayName: SleepHole
        CFBundleDevelopmentRegion: sk
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.zrebec.sleephole
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8V2VSXHQ86   # owner's Personal Team
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [SleepHoleTests]
      gatherCoverageData: true
  SleepHoleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepHoleTests
    dependencies:
      - target: SleepHole
      - package: SleepCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sk.zrebec.sleephole.tests
        DEVELOPMENT_TEAM: 8V2VSXHQ86
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SleepHole.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SleepHole"
        BUNDLE_LOADER: "$(TEST_HOST)"
