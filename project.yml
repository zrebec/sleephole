# XcodeGen spec – run `xcodegen generate` after editing. The .xcodeproj is generated (git-ignored).
name: SleepHole
options:
  bundleIdPrefix: sk.zrebec
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  SleepCore:
    path: SleepCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    # every upload to App Store Connect / TestFlight needs a higher CURRENT_PROJECT_VERSION (builds 1 to 7 are uploaded)
    CURRENT_PROJECT_VERSION: "8"
targets:
  SleepHole:
    type: application
    platform: iOS
    sources:
      - path: SleepHole
      # whole folder is bundled as "sprites/" (catalog.json + L0…L4) – keep only shippable files in it
      - path: assets/sprites
        type: folder
      # audio files go to the bundle root (UNNotificationSound(named:) looks there)
      - path: assets/audio
        buildPhase: resources
        excludes:
          - "*.txt"
      # the plans overview shown in Settings → Developer (Debug builds only – excluded from Release below)
      - path: docs/PREHLAD-PLANOV.md
        buildPhase: resources
    dependencies:
      - package: SleepCore
    info:
      path: SleepHole/Info.plist
      properties:
        CFBundleDisplayName: SleepHole
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sk]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # the automatic backup in Documents is visible in Files → On My iPhone → SleepHole
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # F6b: the system alarm (AlarmKit) asks the owner once; the Slovak text is in Resources/InfoPlist.xcstrings
        NSAlarmKitUsageDescription: SleepHole sets a system alarm as a backup, so you wake up even if iOS closes the app at night. In Strict mode it also rings a short warning when the phone is used at night.
        # HEALTH: read-only access to sleep analysis; the Slovak text is in Resources/InfoPlist.xcstrings
        NSHealthShareUsageDescription: SleepHole reads your sleep data to show when you really fell asleep next to when you went to bed. Nothing leaves your iPhone.
        # App Store Connect requires this key for any app with the HealthKit entitlement (upload refused on 2026-10-10 without it) although the app never writes.
        NSHealthUpdateUsageDescription: SleepHole does not write anything to Apple Health. It only reads your sleep data.
    # F6a: time-sensitive notifications break through a Focus – a capability of the paid team. Proven by a signed
    # device build on 2026-10-04 (before Xcode was restarted it still treated the team as a Personal Team).
    entitlements:
      path: SleepHole/SleepHole.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # TOWN-W: the weather on Today (Apple WeatherKit) – the App ID has the capability ticked on developer.apple.com
        com.apple.developer.weatherkit: true
        # HEALTH: read the owner's sleep from Apple Health (read only – nothing is written)
        com.apple.developer.healthkit: true
        # SYNC: one town on all of a user's devices – every device writes its own file into the app's iCloud Drive container
        # (outside Documents, not shown in Files); the container must exist on developer.apple.com and be ticked on the App ID
        com.apple.developer.icloud-container-identifiers: [iCloud.sk.zrebec.sleephole]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.sk.zrebec.sleephole]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.zrebec.sleephole
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8V2VSXHQ86   # the owner's Apple Developer Program team (paid since 2026-10; the Team ID stayed the same)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # UI text goes through L("English key") → extract those keys like String(localized:)
        LOCALIZED_STRING_MACRO_NAMES: "L NSLocalizedString CFCopyLocalizedString"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: PREHLAD-PLANOV.md
    scheme:
      testTargets: [SleepHoleTests]
      gatherCoverageData: true
  SleepHoleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepHoleTests
    dependencies:
      - target: SleepHole
      - package: SleepCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sk.zrebec.sleephole.tests
        DEVELOPMENT_TEAM: 8V2VSXHQ86
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SleepHole.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SleepHole"
        BUNDLE_LOADER: "$(TEST_HOST)"
